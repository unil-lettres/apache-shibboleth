# https://shibboleth.atlassian.net/wiki/spaces/SHIB2/pages/2577072242/SPReverseProxy

Listen 8080

<VirtualHost *:8080>
    ServerName __SERVER_NAME__
    UseCanonicalName On

    # Reverse proxy configuration
    ProxyRequests Off
    ProxyPreserveHost On

    # Exclude Shibboleth handler from proxying (handles SAML protocol locally)
    ProxyPass /Shibboleth.sso !

    # Include custom configuration (REQUIRED)
    # Define your proxy configuration here: ProxyPass, DocumentRoot, FilesMatch, etc.
    # Mount your custom config to /etc/apache2/vhost.d/ or use APACHE_CUSTOM_CONFIG env var
    IncludeOptional /etc/apache2/vhost.d/*.conf

    # ========================================================================
    # Shibboleth Attribute Forwarding (Auto-configured at container startup)
    # ========================================================================
    # Shibboleth attributes are forwarded as HTTP headers to your backend
    # This allows containerized/microservice backends to access user attributes
    # 
    # Configuration options (in order of priority):
    #   1. SHIB_ATTRIBUTES="attr1,attr2" - Manually specify attributes
    #   2. SHIB_RESOURCE_ID=12731 - Auto-detect from AAI metadata
    #   3. Neither set - No attributes forwarded
    # 
    # Each header is unset before being set, so a value forged by the client
    # can never reach the backend
    #
    # The following block is replaced by entrypoint.sh with RequestHeader directives
    # Example: RequestHeader unset X-Shib-Mail
    #          RequestHeader set X-Shib-Mail %{mail}e env=mail
__SHIB_HEADERS_BLOCK__

    # ========================================================================
    # Shibboleth Protected Paths (Auto-configured at container startup)
    # ========================================================================
    # Control which paths require Shibboleth authentication
    # Configure via SHIB_PROTECTED_PATHS environment variable
    # Examples: "/" (entire site), "/admin,/secure" (specific paths)
    # 
    # The following block is replaced by entrypoint.sh with <Location> directives
__SHIB_PROTECTED_PATHS_BLOCK__

    # Error logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
