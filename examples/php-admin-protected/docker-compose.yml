services:
  app:
    # Serves the application and its static files. In production, replace this
    # with your own image containing the code instead of the bind mount below.
    image: php:8.4-apache
    volumes:
      - ./app:/var/www/html
    # No published port: the application must only be reachable through the
    # proxy, otherwise X-Shib-* headers can be forged
    networks:
      - app-network
    container_name: apache-shibboleth-app

  apache-shibboleth:
    build: ../../
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SHIB_HOSTNAME: "localhost:8080"
      SHIB_CONTACT: "admin@example.ch"
      SHIB_PROTECTED_PATHS: "/admin"
      SHIB_ATTRIBUTES: "mail,givenName,surname,uniqueID"
      APACHE_CUSTOM_CONFIG: |
        # This could also be provided in the custom.conf file mounted below
        <Location /bob>
            # Shibboleth with specific user restriction
            AuthType shibboleth
            ShibRequestSetting requireSession true
            Require shib-attr uniqueID bob@domain.ch
        </Location>
    volumes:
      - ./custom.conf:/etc/apache2/vhost.d/custom.conf:ro
      - shibboleth-certs:/var/lib/shibboleth
      - apache-logs:/var/log/apache2
    networks:
      - app-network
    depends_on:
      - app
    container_name: apache-shibboleth-http

volumes:
  shibboleth-certs:
  apache-logs:

networks:
  app-network:
